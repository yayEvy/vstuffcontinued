name: Compile and Upload Mod to Testers Channel

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build with Gradle
      run: ./gradlew build

    - name: Read Gradle Properties
      uses: guillermocalvo/gradle-properties@v3
      id: gradle_props

    - name: Generate Artifact Link
      run: |
        VS2_VER="${{ steps.gradle_props.outputs['property-vs2_version'] }}"
        VS2_HASH="${{ steps.gradle_props.outputs['property-vs2_hash'] }}"
        VS2_HASH_SUB="${VS2_HASH:0:10}"
        
        # Build the base URL path
        BASE_URL="https://maven.valkyrienskies.org/org/valkyrienskies/valkyrienskies-120-forge"
        VERSION_STR="${VS2_VER}+${VS2_HASH_SUB}"
        
        # Direct links for JAR and POM
        JAR_LINK="${BASE_URL}/${VERSION_STR}/valkyrienskies-120-forge-${VERSION_STR}.jar"

        echo "VS JAR URL: $JAR_LINK"
        
        # Export to environment if needed later in the workflow
        echo "VS_JAR=$JAR_LINK" >> $GITHUB_ENV

    - name: Send Mod to Discord
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        filename: './build/reobfJar/output.jar'
        embed-title: 'New Vstuff Test Build'
        embed-description: 'VS2 Jar used: [Download](${{ env.VS_JAR }})'
        embed-color: '5120926' 
        username: 'Test Blobber The Second'
        avatar-url: 'https://cdn.modrinth.com/data/voOBl6iP/7a2aa3a8dcc706ad7f08f6fd5cf0a1b8a3adfae6_96.webp'
