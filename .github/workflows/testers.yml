name: Compile and Upload Mod to Testers Channel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Generate Artifact Link
      run: |
        get_prop() { grep -E "^$1\s*=" gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]'; }

        VS2_VER=$(get_prop vs2_version)
        VS2_HASH=$(get_prop vs2_hash)
        VERSION_STR="${VS2_VER}+${VS2_HASH:0:10}"

        BASE_URL="https://maven.valkyrienskies.org/org/valkyrienskies/valkyrienskies-120-forge"
        JAR_LINK="${BASE_URL}/${VERSION_STR}/valkyrienskies-120-forge-${VERSION_STR}.jar"

        echo "VS JAR URL: $JAR_LINK"
        echo "VS_JAR=$JAR_LINK" >> "$GITHUB_ENV"

    - name: Send build embed to Discord
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
        status: success
        title: 'New Vstuff Test Build'
        description: 'VS2 Jar used: [Download](${{ env.VS_JAR }})'
        username: 'Test Blobber The Second'
        avatar_url: 'https://cdn.modrinth.com/data/voOBl6iP/7a2aa3a8dcc706ad7f08f6fd5cf0a1b8a3adfae6_96.webp'

    - name: Upload mod jar to Discord
      uses: tsickert/discord-webhook@v7.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        filename: './build/reobfJar/output.jar'
        username: 'Test Blobber The Second'
        avatar-url: 'https://cdn.modrinth.com/data/voOBl6iP/7a2aa3a8dcc706ad7f08f6fd5cf0a1b8a3adfae6_96.webp'
