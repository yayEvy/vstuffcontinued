name: Compile and Upload Mod to Testers Channel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Compute build metadata
      run: |
        get_prop() { grep -E "^$1\s*=" gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]'; }

        # VS2 jar link
        VS2_VER=$(get_prop vs2_version)
        VS2_HASH=$(get_prop vs2_hash)
        VERSION_STR="${VS2_VER}+${VS2_HASH:0:10}"
        BASE_URL="https://maven.valkyrienskies.org/org/valkyrienskies/valkyrienskies-120-forge"
        JAR_LINK="${BASE_URL}/${VERSION_STR}/valkyrienskies-120-forge-${VERSION_STR}.jar"
        echo "VS JAR URL: $JAR_LINK"

        {
          echo "VS_JAR=$JAR_LINK"
        } >> "$GITHUB_ENV"

    - name: Upload build as artifact
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: vstuff-reobf-builds
        path: ./build/libs/*.jar
        if-no-files-found: error

    - name: Send Mod to Discord
      env:
        WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        COMMIT_SHA: ${{ github.sha }}
        ACTOR: ${{ github.actor }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        SERVER_URL: ${{ github.server_url }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        SHORT_SHA="${COMMIT_SHA:0:7}"
        COMMIT_MSG=$(git log -1 --pretty=%s)
        AUTHOR=$(git log -1 --pretty=%an)
        COMMIT_URL="${SERVER_URL}/${REPO}/commit/${COMMIT_SHA}"

        DESC="**Commit:** [\`${SHORT_SHA}\`](${COMMIT_URL}) ${COMMIT_MSG}"$'\n'"**Author:** ${AUTHOR}"$'\n'"**Build triggered by:** ${ACTOR}"$'\n'"**VS2 Jar Used For Build:** [Download](${VS_JAR})"$'\n'"**Workflow Artifact:** [Download](${ARTIFACT_URL})"

        jq -n \
          --arg desc "$DESC" \
          --arg repo "$REPO" \
          --arg branch "$BRANCH" \
          --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{
            username: "Test Blobber The Second",
            avatar_url: "https://cdn.modrinth.com/data/voOBl6iP/7a2aa3a8dcc706ad7f08f6fd5cf0a1b8a3adfae6_96.webp",
            embeds: [{
              title: "New Vstuff Test Build",
              description: $desc,
              color: 5120926,
              fields: [
                { name: "Repository", value: $repo, inline: true },
                { name: "Branch", value: $branch, inline: true }
              ],
              footer: {
                text: "GitHub Actions",
                icon_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              },
              timestamp: $ts
            }]
          }' > payload.json

        CURL_ARGS=()
        for jar in build/libs/*.jar; do
          if [ -f "$jar" ]; then
            echo "Found jar to upload: $jar"
            CURL_ARGS+=("-F" "file=@${jar}")
          fi
        done

        curl -sS --fail \
          -F "payload_json=<payload.json" \
          "${CURL_ARGS[@]}" \
          "$WEBHOOK_URL"
